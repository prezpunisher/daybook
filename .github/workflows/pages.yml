name: Publish dashboard

# Republish the dashboard when the page itself changes (scan runs publish it after every run too).
on:
  push:
    branches: [main]
    paths: [docs/index.html, docs/research.html, docs/portfolio.html]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
