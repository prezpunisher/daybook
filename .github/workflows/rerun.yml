name: Rerun

# The dashboard's rerun buttons open a prefilled issue titled "Rerun: <process> [YYYY-MM-DD]". When the repo owner
# submits it, this starts that process right away and closes the issue with a link to the run. Anyone else's issues,
# and any title that isn't exactly one of these, are ignored.
on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  rerun:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Rerun:')
    runs-on: ubuntu-latest
    steps:
      - name: Start it
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}        # passed as data, matched against an allowlist
          NUM: ${{ github.event.issue.number }}
        run: |
          re='^Rerun: (premarket|watchlist|reminder|review|research)( ([0-9]{4}-[0-9]{2}-[0-9]{2}))?$'
          if [[ ! "$TITLE" =~ $re ]]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "Not a rerun I know. Use the buttons on the dashboard."
            exit 0
          fi
          kind="${BASH_REMATCH[1]}"; day="${BASH_REMATCH[3]}"
          if [ "$kind" = research ]; then
            gh workflow run research.yml -R "$GITHUB_REPOSITORY"
            wf=research.yml; what="Research and portfolios"
          else
            gh workflow run daybook.yml -R "$GITHUB_REPOSITORY" -f slot="$kind" -f date="$day"
            wf=daybook.yml; what="$kind${day:+ for $day}"
          fi
          sleep 8
          url=$(gh run list -R "$GITHUB_REPOSITORY" -w "$wf" -L 1 --json url -q '.[0].url')
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY" -c "Started: $what. Run: $url. Results land on the dashboard in a few minutes."
